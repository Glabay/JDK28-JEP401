spring.application.name=JDK28-JEP401

# DATASOURCE
spring.datasource.url=jdbc:postgresql://localhost:5496/midnight_database
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${POSTGRES_USER:MIDNIGHT_ADMIN}
spring.datasource.password=${POSTGRES_PASSWORD:MIDNIGHT_DEV_PASSWORD}
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.type.preferred_enum_type=VARCHAR